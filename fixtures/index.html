<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>e2e_base Fixture — お問い合わせ</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>お問い合わせフォーム</h1>
      <p class="lead">デモ用の静的ページです。Semantic Target 解決の検証に使います。</p>

      <form id="contact" action="#" method="get">
        <div class="field">
          <label for="name">名前入力</label>
          <input id="name" name="name" type="text" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">メール入力</label>
          <input id="email" name="email" type="email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="message">メッセージ</label>
          <textarea id="message" name="message" rows="4"></textarea>
        </div>
        <button type="submit" id="submit">送信ボタン</button>
      </form>

      <p id="success" class="success" hidden>送信しました</p>
    </main>
    <script>
      document.getElementById("contact").addEventListener("submit", function (event) {
        event.preventDefault();
        var success = document.getElementById("success");
        success.hidden = false;
        success.setAttribute("aria-label", "成功メッセージ");
        success.focus();
      });
    </script>
  </body>
</html>
